[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy"
version = "0.1.0"
description = "Natural language query tool for a bioacoustic species-monitoring database."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "gradio>=6.0",
    "langdetect==1.0.9",
    "azure-ai-inference>=1.0.0b9",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "llama-index-core>=0.14",
    "llama-index-llms-openai>=0.4",
    # Pinned to the v2 client API (trace()/span()/score()) that observability.py
    # targets. v3+ moved to an OTel-based client with a different surface —
    # revisit when Langfuse tracing is actually turned on for real traffic,
    # not before, since this feature is dormant (CANOPY_LANGFUSE_ENABLED
    # unset) until Canopy has real users. See DECISIONS.md's Operations entry.
    "langfuse==2.60.10",
    # A/B experiment (show-SQL-by-default): PostHog's server-side
    # get_feature_flag() gives deterministic, hash-based variant assignment
    # keyed by distinct_id — no client-side persistence to get wrong, unlike
    # the hand-rolled gr.BrowserState version this replaced. Dormant until
    # both CANOPY_AB_SHOW_SQL_ACTIVE and a real project key are set.
    "posthog==7.44.2",
    # Scaling upgrade: Redis-backed exact-match cache (canopy/cache.py) and the
    # semantic SQL-plan cache (canopy/semantic_cache.py). Both dormant behind
    # CANOPY_REDIS_URL / CANOPY_SEMANTIC_CACHE_ENABLED — see DECISIONS.md.
    "redis>=5.0",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "fakeredis>=2.20"]
e2e = ["pytest-playwright>=0.5", "playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]
addopts = "-m 'not live_db'"
markers = [
    "e2e: end-to-end browser tests — require: make playwright-install",
    "live_db: requires a live PostgreSQL connection and API keys",
]
filterwarnings = [
    # Gradio uses a renamed Starlette constant — not actionable from canopy's code.
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:UserWarning",
    # Pandas 4 deprecation warnings emitted by Gradio's queueing internals.
    "ignore:.*no_silent_downcasting.*",
    "ignore:.*copy keyword is deprecated.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]   # pycodestyle errors, pyflakes, isort, annotations
ignore = ["ANN401"]                # **kwargs: Any is mandated by LlamaIndex base interfaces

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]    # pytest fixtures use untyped args by convention
"scripts/**" = ["ANN"]  # scripts are not part of the public API
