# Canopy model connections
#
# Each connection has:
#   id          — used as MODEL_BACKEND value and in benchmark output
#   backend     — "anthropic", "azure", or "nvidia" (any string works; only
#                 "anthropic" is special-cased to raise in registry.py)
#   api_style   — one of:
#                   "azure-inference"   (default) azure-ai-inference SDK, /models endpoint
#                   "openai-compat"     OpenAI SDK, Azure quirks patched (max_completion_tokens,
#                                       fixed context window) — Azure project-scoped paths only
#                   "openai-responses"  urllib POST to /openai/v1/responses (Responses API)
#                   "openai-standard"   stock OpenAI SDK, no patching — plain third-party
#                                       OpenAI-compatible hosts (e.g. NVIDIA's integrate API)
#   active      — false = skip in benchmark until deployment is activated by admin
#   endpoint    — base URL for this connection path
#   api_key_env — name of the .env variable that holds the API key
#   models      — list of deployment names to test; empty list = auto-discover
#   timeout     — optional, seconds (default: 60)
#
# All four capa connections share the same key (AZURE_CAPA_API_KEY) on the
# same resource (capa-4249-resource). The endpoint path differs per deployment.

connections:
  # ------------------------------------------------------------------
  # Anthropic (personal key — Azure does not support Anthropic models)
  # active: false — API credits exhausted; re-enable after topping up
  # at console.anthropic.com
  # ------------------------------------------------------------------
  - id: claude-sonnet
    backend: anthropic
    api_key_env: ANTHROPIC_API_KEY
    active: false
    models:
      - claude-sonnet-4-6
    timeout: 60

  # ------------------------------------------------------------------
  # Azure capa — gpt-5.1-codex-mini (OpenAI Responses API, active)
  # POST /openai/v1/responses — different request/response shape from
  # chat completions; handled by AzureResponsesClient
  # ------------------------------------------------------------------
  - id: gpt-5.1-codex-mini
    backend: azure
    api_style: openai-responses
    active: true
    endpoint: https://capa-4249-resource.services.ai.azure.com/openai/v1/
    api_key_env: AZURE_CAPA_API_KEY
    models:
      - gpt-5.1-codex-mini
    timeout: 60

  # ------------------------------------------------------------------
  # Azure capa — gpt-5.1-2 (project-scoped openai/v1 path, active)
  # Uses /api/projects/<id>/openai/v1/chat/completions — no api-version
  # required. Requires max_completion_tokens instead of max_tokens.
  # ------------------------------------------------------------------
  - id: gpt-5.1-2
    backend: azure
    api_style: openai-compat
    active: true
    endpoint: https://capa-4249-resource.services.ai.azure.com/api/projects/capa-4249/openai/v1/
    api_key_env: AZURE_CAPA_API_KEY
    models:
      - gpt-5.1-2
    timeout: 60

  # ------------------------------------------------------------------
  # Azure capa — Phi-4 (inactive until admin activates the deployment)
  # Standard OpenAI-compatible chat completions path
  # ------------------------------------------------------------------
  - id: phi-4
    backend: azure
    api_style: openai-compat
    active: false
    endpoint: https://capa-4249-resource.services.ai.azure.com/openai/v1/
    api_key_env: AZURE_CAPA_API_KEY
    models:
      - Phi-4
    timeout: 60

  # ------------------------------------------------------------------
  # Azure capa — Qwen3-4B (inactive until admin activates the deployment)
  # Standard OpenAI-compatible chat completions path
  # ------------------------------------------------------------------
  - id: qwen-3-4b
    backend: azure
    api_style: openai-compat
    active: false
    endpoint: https://capa-4249-resource.services.ai.azure.com/openai/v1/
    api_key_env: AZURE_CAPA_API_KEY
    models:
      - qwen--qwen3-4b-instruct-2507
    timeout: 60

  # ------------------------------------------------------------------
  # NVIDIA integrate API (personal account, standalone from the capa Azure
  # resource). Added when Azure custom-model access was revoked, to keep the
  # query loop functional for online-eval instrumentation work. Standard
  # OpenAI-SDK-compatible endpoint — no Azure-specific request/response
  # patching needed (see models/llamaindex_compat.py's
  # build_openai_standard_llm).
  #
  # deepseek-v4-flash-0731 was tried first; chat completions 401'd with the
  # original key even though models.list() succeeded with the same key —
  # an account-provisioning gap (listing/catalogue access without
  # inference access), not a model-naming or code issue. A rotated key
  # resolved it. kimi-k3 (moonshotai) confirmed working via curl with the
  # new key before being wired in here — see DECISIONS.md's Operations
  # entry for this connection.
  # ------------------------------------------------------------------
  - id: nvidia-kimi-k3
    backend: nvidia
    api_style: openai-standard
    active: true
    endpoint: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    models:
      - moonshotai/kimi-k3
    timeout: 60

  - id: nvidia-deepseek-v4-flash
    backend: nvidia
    api_style: openai-standard
    active: false  # 401'd on inference with the original key; not retested since rotation
    endpoint: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    models:
      - deepseek-ai/deepseek-v4-flash-0731
    timeout: 60
