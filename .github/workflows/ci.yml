name: CI

on:
  pull_request:
    branches: ["**"]

# Branch protection note:
# Go to Settings → Branches → Add rule for "main":
#   ✅ Require status checks to pass before merging
#       Required checks: check, e2e
#   ✅ Require branches to be up to date before merging
#   ✅ Do not allow bypassing the above settings

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Test
        run: pytest tests/ -q --ignore=tests/e2e/ --cov=src/canopy --cov-report=xml

      - name: Dependency vulnerability scan (informational)
        # Not blocking: pillow (transitive via gradio/llama-index-core) has
        # known CVEs fixed only in 13.0+, but gradio 6.x pins pillow<13.0 —
        # the fix isn't installable without a gradio upgrade this review
        # didn't verify is safe. Same "real signal, not yet a gate" posture
        # as codecov/patch (see DECISIONS.md's O8 section). Revisit blocking
        # this once gradio raises its pillow ceiling or canopy upgrades it.
        run: pip install pip-audit && pip-audit || true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev,e2e]"

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: E2E tests
        run: pytest tests/e2e/ -v
