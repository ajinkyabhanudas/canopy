# Codecov patch-coverage policy.
#
# Why this exists: build_app() in src/canopy/ui/app.py is Gradio component
# wiring — it only executes meaningfully inside a running Gradio Blocks
# context. It's exercised by the e2e suite (tests/e2e/, a real server +
# Playwright), not by unit tests. CI's own coverage run explicitly excludes
# e2e (see .github/workflows/ci.yml: `pytest tests/ -q --ignore=tests/e2e/
# --cov=...`), so that coverage never reaches Codecov — a structural gap in
# what gets uploaded, not a gap in what gets tested. See DECISIONS.md's
# codecov-patch-coverage entry for the investigation that confirmed this.
#
# The two required CI checks (`check`, `e2e` — see ci.yml's branch-protection
# comment) already gate correctness. This threshold keeps patch coverage
# informative for real logic changes without failing on Gradio wiring that
# is tested a different way.

coverage:
  status:
    patch:
      default:
        target: auto
        threshold: 15%
        informational: true
    project:
      default:
        target: auto
        threshold: 2%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
